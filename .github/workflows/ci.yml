name: CI

# Runs on every push and pull request, and again on every deployment via the
# `deployment` workflow. Cheap static checks fail fast in `verify`; the
# browser-level jobs share one production build so Chrome is launched against
# exactly the bundle that would ship.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      target-url:
        description: >-
          Audit this deployed origin instead of a locally built preview.
          Used by the deployment workflow to validate the real thing.
        required: false
        type: string
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PORT: "4173"

jobs:
  verify:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check the article index is up to date
        run: |
          bun run content:index
          if [ -n "$(git status --porcelain src/content/articles/index.ts)" ]; then
            echo "::error file=src/content/articles/index.ts::Article index is stale. Run: bun run content:index"
            git --no-pager diff -- src/content/articles/index.ts
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Format and lint
        run: |
          bunx prettier --write .
          bun run lint

      - name: Scan for secrets, personal data and local paths
        run: bun run scan:secrets

      - name: Validate content schema and metadata
        run: bun run validate:content

      - name: Unit tests
        run: bun run test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          if-no-files-found: ignore

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build:node

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: node-build
          path: .output/
          include-hidden-files: true
          if-no-files-found: error

  accessibility:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - uses: actions/download-artifact@v4
        with:
          name: node-build
          path: .output

      - name: Install browser
        run: bunx playwright install --with-deps chromium

      - name: Run axe accessibility suite
        run: bun run test:a11y

      - name: Crawl routes and audit HTML
        run: bun run crawl:check

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: test-results/
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse and Core Web Vitals
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - uses: actions/download-artifact@v4
        with:
          name: node-build
          path: .output

      - name: Run Lighthouse CI
        env:
          LHCI_TARGET_URL: ${{ inputs.target-url }}
        run: bun run test:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
